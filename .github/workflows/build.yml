    - name: Create Project Structure & iOS Style UI
      run: |
        set -e
        mkdir -p app/src/main/java/com/mercury/configurator
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/layout

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "mercury-app"
        include(":app")
        EOF

        cat << 'EOF' > gradle.properties
        android.suppressUnsupportedCompileSdk=34
        org.gradle.daemon=false
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.mercury.configurator"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.mercury.configurator"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
        }
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ios_card_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ios_button_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android"
            android:shape="rectangle">
            <solid android:color="#007AFF"/>
            <corners android:radius="10dp"/>
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <string name="app_name">Меркурий Конфигуратор</string>
            <style name="Theme.MercuryConfigurator" parent="Theme.Material3.DayNight.NoActionBar">
                <item name="colorPrimary">#007AFF</item>
                <item name="colorSecondary">#5856D6</item>
                <item name="android:windowBackground">#F2F2F7</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.MercuryConfigurator">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#F2F2F7">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:paddingHorizontal="16dp"
                android:paddingTop="20dp"
                android:paddingBottom="12dp"
                android:background="#F2F2F7">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Меркурий"
                    android:textSize="28sp"
                    android:textStyle="bold"
                    android:textColor="#000000"/>
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Конфигурация и опрос"
                    android:textSize="13sp"
                    android:textColor="#8E8E93"/>
            </LinearLayout>

            <ScrollView
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:paddingHorizontal="16dp"
                android:paddingBottom="16dp">

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical">

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:background="@drawable/ios_card_background"
                        android:padding="16dp"
                        android:layout_marginBottom="16dp">

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="ПАРАМЕТРЫ СВЯЗИ"
                            android:textSize="12sp"
                            android:textStyle="bold"
                            android:textColor="#6D6D72"
                            android:layout_marginBottom="8dp"/>

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="Интерфейс"
                            android:textSize="13sp"
                            android:textColor="#8E8E93"/>
                        <Spinner
                            android:id="@+id/spinnerInterface"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:layout_marginBottom="8dp"/>

                        <TextView
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="Протокол"
                            android:textSize="13sp"
                            android:textColor="#8E8E93"/>
                        <Spinner
                            android:id="@+id/spinnerProtocol"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:layout_marginBottom="12dp"/>

                        <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E5EA" android:layout_marginBottom="12dp"/>

                        <EditText
                            android:id="@+id/etHost"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:hint="IP-адрес / Хост (напр. 192.168.1.50)"
                            android:textSize="15sp"
                            android:textColor="#000000"
                            android:textColorHint="#C7C7CC"
                            android:background="@null"
                            android:inputType="textUri"
                            android:maxLines="1"
                            android:layout_marginBottom="12dp"/>

                        <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E5EA" android:layout_marginBottom="12dp"/>

                        <EditText
                            android:id="@+id/etPassword"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:hint="Пароль доступа"
                            android:textSize="15sp"
                            android:textColor="#000000"
                            android:textColorHint="#C7C7CC"
                            android:background="@null"
                            android:inputType="textPassword"
                            android:maxLines="1"
                            android:layout_marginBottom="16dp"/>

                        <Button
                            android:id="@+id/btnConnect"
                            android:layout_width="match_parent"
                            android:layout_height="48dp"
                            android:text="Подключить"
                            android:textSize="16sp"
                            android:textStyle="bold"
                            android:textColor="#FFFFFF"
                            android:background="@drawable/ios_button_background"
                            android:stateListAnimator="@null"/>
                    </LinearLayout>

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:background="@drawable/ios_card_background"
                        android:padding="16dp"
                        android:layout_marginBottom="16dp">

                        <TextView
                            android:id="@+id/tvStatus"
                            android:layout_width="match_parent"
                            android:layout_height="wrap_content"
                            android:text="Статус: Не подключено"
                            android:textSize="14sp"
                            android:textColor="#FF3B30"
                            android:textStyle="bold"/>
                    </LinearLayout>

                    <com.google.android.material.tabs.TabLayout
                        android:id="@+id/tabLayout"
                        android:layout_width="match_parent"
                        android:layout_height="46dp"
                        android:background="@drawable/ios_card_background"
                        android:layout_marginBottom="16dp"
                        app:tabIndicatorColor="#007AFF"
                        app:tabSelectedTextColor="#007AFF"
                        app:tabTextColor="#8E8E93"/>

                    <LinearLayout
                        android:id="@+id/layoutEnergy"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:background="@drawable/ios_card_background"
                        android:padding="16dp">

                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ЭНЕРГИЯ" android:textSize="12sp" android:textStyle="bold" android:textColor="#6D6D72" android:layout_marginBottom="8dp"/>
                        <TextView android:id="@+id/tvEnergyAPlus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="А+ (Активная прямая): 0.00 кВт*ч" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvEnergyAMinus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="А- (Активная обратная): 0.00 кВт*ч" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvEnergyRPlus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Р+ (Реактивная индуктивная): 0.00 квар*ч" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvEnergyRMinus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Р- (Реактивная емкостная): 0.00 квар*ч" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>

                        <Button
                            android:id="@+id/btnReadEnergy"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:text="Считать энергию"
                            android:textColor="#007AFF"
                            android:background="@null"
                            android:textStyle="bold"
                            android:layout_marginTop="12dp"/>
                    </LinearLayout>

                    <LinearLayout
                        android:id="@+id/layoutNetwork"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:background="@drawable/ios_card_background"
                        android:padding="16dp"
                        android:visibility="gone">

                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ПАРАМЕТРЫ СЕТИ" android:textSize="12sp" android:textStyle="bold" android:textColor="#6D6D72" android:layout_marginBottom="8dp"/>
                        <TextView android:id="@+id/tvVoltage" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Напряжение (U): Фаза A=0 В, B=0 В, C=0 В" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvCurrent" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Ток (I): Фаза A=0 А, B=0 А, C=0 А" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvDateTime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Дата и время: --.--.---- --:--:--" android:textColor="#000000" android:textSize="14sp" android:textStyle="bold" android:paddingVertical="4dp"/>

                        <Button
                            android:id="@+id/btnReadNetwork"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:text="Считать параметры"
                            android:textColor="#007AFF"
                            android:background="@null"
                            android:textStyle="bold"
                            android:layout_marginTop="12dp"/>
                    </LinearLayout>

                    <LinearLayout
                        android:id="@+id/layoutVector"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="vertical"
                        android:background="@drawable/ios_card_background"
                        android:padding="16dp"
                        android:visibility="gone">

                        <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ВЕКТОРНАЯ ДИАГРАММА" android:textSize="12sp" android:textStyle="bold" android:textColor="#6D6D72" android:layout_marginBottom="8dp"/>
                        <TextView android:id="@+id/tvVectorA" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Фаза A: U=0°, I=0° (Cosφ = 1.0)" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvVectorB" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Фаза B: U=120°, I=120° (Cosφ = 1.0)" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>
                        <TextView android:id="@+id/tvVectorC" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Фаза C: U=240°, I=240° (Cosφ = 1.0)" android:textColor="#000000" android:textSize="14sp" android:paddingVertical="4dp"/>

                        <Button
                            android:id="@+id/btnReadVector"
                            android:layout_width="match_parent"
                            android:layout_height="44dp"
                            android:text="Обновить диаграмму"
                            android:textColor="#007AFF"
                            android:background="@null"
                            android:textStyle="bold"
                            android:layout_marginTop="12dp"/>
                    </LinearLayout>

                </LinearLayout>
            </ScrollView>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/mercury/configurator/MainActivity.kt
        package com.mercury.configurator

        import android.os.Bundle
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import com.google.android.material.tabs.TabLayout
        import java.text.SimpleDateFormat
        import java.util.*

        class MainActivity : AppCompatActivity() {
            private var isConnected = false

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val spinnerInterface = findViewById<Spinner>(R.id.spinnerInterface)
                val spinnerProtocol = findViewById<Spinner>(R.id.spinnerProtocol)
                val etHost = findViewById<EditText>(R.id.etHost)
                val etPassword = findViewById<EditText>(R.id.etPassword)
                val btnConnect = findViewById<Button>(R.id.btnConnect)
                val tvStatus = findViewById<TextView>(R.id.tvStatus)
                val tabLayout = findViewById<TabLayout>(R.id.tabLayout)

                val layoutEnergy = findViewById<LinearLayout>(R.id.layoutEnergy)
                val layoutNetwork = findViewById<LinearLayout>(R.id.layoutNetwork)
                val layoutVector = findViewById<LinearLayout>(R.id.layoutVector)

                spinnerInterface.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("RS-485", "TCP/IP", "Оптопорт (УСО-2)"))
                spinnerProtocol.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("Протокол Меркурий", "СПОДЕС"))

                tabLayout.addTab(tabLayout.newTab().setText("Энергия"))
                tabLayout.addTab(tabLayout.newTab().setText("Сеть"))
                tabLayout.addTab(tabLayout.newTab().setText("Вектора"))

                tabLayout.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                    override fun onTabSelected(tab: TabLayout.Tab?) {
                        layoutEnergy.visibility = View.GONE
                        layoutNetwork.visibility = View.GONE
                        layoutVector.visibility = View.GONE
                        when (tab?.position) {
                            0 -> layoutEnergy.visibility = View.VISIBLE
                            1 -> layoutNetwork.visibility = View.VISIBLE
                            2 -> layoutVector.visibility = View.VISIBLE
                        }
                    }
                    override fun onTabUnselected(tab: TabLayout.Tab?) {}
                    override fun onTabReselected(tab: TabLayout.Tab?) {}
                })

                btnConnect.setOnClickListener {
                    if (!isConnected) {
                        val host = etHost.text.toString().trim()
                        if (host.isEmpty()) {
                            showToast("Введите IP-адрес или хост")
                            return@setOnClickListener
                        }

                        isConnected = true
                        tvStatus.text = "Статус: Подключено к $host"
                        tvStatus.setTextColor(android.graphics.Color.parseColor("#34C759"))
                        btnConnect.text = "Отключить"
                        btnConnect.setBackgroundColor(android.graphics.Color.parseColor("#FF3B30"))

                        etHost.isEnabled = false
                        etPassword.isEnabled = false
                        spinnerInterface.isEnabled = false
                        spinnerProtocol.isEnabled = false

                        showToast("Соединение установлено")
                    } else {
                        isConnected = false
                        tvStatus.text = "Статус: Не подключено"
                        tvStatus.setTextColor(android.graphics.Color.parseColor("#FF3B30"))
                        btnConnect.text = "Подключить"
                        btnConnect.setBackgroundColor(android.graphics.Color.parseColor("#007AFF"))

                        etHost.isEnabled = true
                        etPassword.isEnabled = true
                        spinnerInterface.isEnabled = true
                        spinnerProtocol.isEnabled = true
                    }
                }

                findViewById<Button>(R.id.btnReadEnergy).setOnClickListener {
                    if (!isConnected) { showToast("Сначала выполните подключение"); return@setOnClickListener }
                    findViewById<TextView>(R.id.tvEnergyAPlus).text = "А+ (Активная прямая): 1423.56 кВт*ч"
                    findViewById<TextView>(R.id.tvEnergyAMinus).text = "А- (Активная обратная): 12.40 кВт*ч"
                    findViewById<TextView>(R.id.tvEnergyRPlus).text = "Р+ (Реактивная индуктивная): 156.80 квар*ч"
                    findViewById<TextView>(R.id.tvEnergyRMinus).text = "Р- (Реактивная емкостная): 5.12 квар*ч"
                    showToast("Энергия считана")
                }

                findViewById<Button>(R.id.btnReadNetwork).setOnClickListener {
                    if (!isConnected) { showToast("Сначала выполните подключение"); return@setOnClickListener }
                    findViewById<TextView>(R.id.tvVoltage).text = "Напряжение (U): Фаза A=230.4 В, B=229.8 В, C=231.1 В"
                    findViewById<TextView>(R.id.tvCurrent).text = "Ток (I): Фаза A=5.2 А, B=4.8 А, C=5.1 А"
                    
                    val sdf = SimpleDateFormat("dd.MM.yyyy HH:mm:ss", Locale.getDefault())
                    findViewById<TextView>(R.id.tvDateTime).text = "Дата и время: " + sdf.format(Date())
                    showToast("Параметры обновлены")
                }

                findViewById<Button>(R.id.btnReadVector).setOnClickListener {
                    if (!isConnected) { showToast("Сначала выполните подключение"); return@setOnClickListener }
                    findViewById<TextView>(R.id.tvVectorA).text = "Фаза A: U=0°, I=15° (Cosφ = 0.96)"
                    findViewById<TextView>(R.id.tvVectorB).text = "Фаза B: U=120°, I=135° (Cosφ = 0.95)"
                    findViewById<TextView>(R.id.tvVectorC).text = "Фаза C: U=240°, I=252° (Cosφ = 0.97)"
                    showToast("Диаграмма обновлена")
                }
            }

            private fun showToast(msg: String) {
                Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        gradle wrapper --gradle-version 8.5
